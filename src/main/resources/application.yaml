server:
  port: 8081
spring:
  application:
    name: hmdp2
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # MySQL 8 常用 caching_sha2_password；本地非 TLS 环境需允许驱动获取服务端公钥。
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/hmdp2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456789}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456789}
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:hmdp}
    password: ${RABBITMQ_PASSWORD:hmdp123}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        # 单条取消息会限制削峰后的消费吞吐；批量预取并发消费后仍由幂等和锁保证正确性。
        concurrency: 4
        max-concurrency: 16
        prefetch: 50
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug

# 秒杀参数统一放在配置中，压测和故障演练时无需修改 Java 代码。
hmdp:
  seckill:
    order-timeout-millis: ${SECKILL_ORDER_TIMEOUT_MILLIS:900000}
    publish-confirm-timeout-millis: 5000
    publish-max-attempts: 3
    reservation-ttl-seconds: 86400
    recovery-fixed-delay-millis: 3000
    close-fallback-fixed-delay-millis: 60000
    recovery-batch-size: 100
    rate-limit:
      window-millis: 1000
      global-requests: 2000
      user-requests: 5

# Prometheus 数据用于压测报告；生产环境可再通过网络策略限制访问。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
